name: Testes e APK Android

on:
  push:
    branches: [main, feat/nuvem-seguranca-apk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manutencao_veiculos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  apk:
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: manutencao_veiculos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configurar conexão pública do aplicativo
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlparse
          with open('env.public.json') as f:
              defaults = json.load(f)
          url = os.environ['SUPABASE_URL'] or defaults['SUPABASE_URL']
          key = os.environ['SUPABASE_ANON_KEY'] or defaults['SUPABASE_ANON_KEY']
          if urlparse(url).scheme != 'https' or not urlparse(url).hostname or not key:
              raise SystemExit('Configure SUPABASE_URL e SUPABASE_ANON_KEY nas Variables do repositório.')
          if not key.startswith('sb_publishable_'):
              import base64
              try:
                  payload = key.split('.')[1]
                  role = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))['role']
              except Exception:
                  raise SystemExit('Use uma chave publishable ou anon pública válida.')
              if role != 'anon':
                  raise SystemExit('Chaves administrativas são proibidas no APK.')
          with open('env.json', 'w') as f:
              json.dump({'SUPABASE_URL': url, 'SUPABASE_ANON_KEY': key}, f)
          PY
      - name: Gerar APK para apresentação
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: minha-garagem-apk
          path: manutencao_veiculos/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: simbolos-debug
          path: manutencao_veiculos/build/symbols/
          if-no-files-found: error
          retention-days: 14
